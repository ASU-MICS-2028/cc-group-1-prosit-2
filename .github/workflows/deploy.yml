# Deploy: build, scan and release HealthConnect to AWS.
#
#   push to development  ->  staging     (automatic; the team's shared test URL)
#   push to main         ->  production  (waits for approval in the "production" environment)
#   Run workflow         ->  either, optionally with an older image tag (= rollback)
#
# No AWS keys are stored: the job gets short-lived credentials through GitHub's OIDC, for a
# role that may only push our images and run the deploy script on our server
# (deploy/terraform/iam.tf). The server is reached with SSM Run Command: no SSH, no open port.
#
# Images are built natively for arm64 (the Graviton server) and tagged with the commit SHA.
# Tags are immutable in ECR, so a tag always means the same image, and rolling back is
# re-deploying an older SHA.

name: Deploy

on:
  push:
    branches: [development, main]
    paths-ignore: ["**.md", "docs/**", "labs/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      frontend_tag:
        description: "Roll back: frontend image tag (a commit SHA). Empty = build this commit."
        required: false
      backend_tag:
        description: "Roll back: backend image tag. Empty = build this commit (if there is a backend)."
        required: false

permissions:
  contents: read
  id-token: write # OIDC to AWS

env:
  AWS_REGION: af-south-1

jobs:
  release:
    name: Release to ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    runs-on: ubuntu-24.04-arm
    environment:
      name: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      url: ${{ vars.APP_URL }}
    # One release per environment at a time; never cancel one half-way.
    concurrency:
      group: deploy-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Choose image tags
        id: tags
        env:
          FRONTEND_INPUT: ${{ github.event.inputs.frontend_tag }}
          BACKEND_INPUT: ${{ github.event.inputs.backend_tag }}
        run: |
          echo "frontend=${FRONTEND_INPUT:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [ -n "$BACKEND_INPUT" ]; then
            echo "backend=$BACKEND_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -f backend/Dockerfile ]; then
            echo "backend=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "No backend/Dockerfile yet: releasing the app without the API (it answers 503)."
            echo "backend=" >> "$GITHUB_OUTPUT"
          fi

      # Same SHA already built (a re-run, or the same commit on both branches): reuse it.
      - name: Already built?
        id: exists
        env:
          FRONTEND_TAG: ${{ steps.tags.outputs.frontend }}
          BACKEND_TAG: ${{ steps.tags.outputs.backend }}
        run: |
          has() { aws ecr describe-images --repository-name "healthconnect/$1" --image-ids imageTag="$2" >/dev/null 2>&1 && echo true || echo false; }
          echo "frontend=$(has frontend "$FRONTEND_TAG")" >> "$GITHUB_OUTPUT"
          if [ -n "$BACKEND_TAG" ]; then echo "backend=$(has backend "$BACKEND_TAG")" >> "$GITHUB_OUTPUT"; else echo "backend=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build and push the frontend
        if: steps.exists.outputs.frontend == 'false'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/healthconnect/frontend:${{ steps.tags.outputs.frontend }}
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64

      - name: Build and push the backend
        if: steps.exists.outputs.backend == 'false'
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/healthconnect/backend:${{ steps.tags.outputs.backend }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

      # Block a release with a CRITICAL vulnerability that already has a fix.
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/healthconnect/frontend:${{ steps.tags.outputs.frontend }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the backend image
        if: steps.tags.outputs.backend != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/healthconnect/backend:${{ steps.tags.outputs.backend }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Release on the server (SSM Run Command)
        env:
          FRONTEND_TAG: ${{ steps.tags.outputs.frontend }}
          BACKEND_TAG: ${{ steps.tags.outputs.backend }}
        run: |
          set -euo pipefail
          instance=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=healthconnect-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$instance" = None ] || [ -z "$instance" ]; then
            echo "::error::The app server isn't running (app_running = false, or the nightly stop)."; exit 1
          fi
          script=$(base64 -w0 deploy/remote-deploy.sh)
          compose=$(base64 -w0 deploy/compose.yml)
          jq -n --arg s "$script" --arg c "$compose" --arg e "$ENVIRONMENT" --arg f "$FRONTEND_TAG" --arg b "$BACKEND_TAG" '{
            commands: [
              "echo \($s) | base64 -d > /tmp/hc-deploy.sh",
              "COMPOSE_B64=\($c) bash /tmp/hc-deploy.sh \($e) \($f) \($b)"
            ],
            executionTimeout: ["900"]
          }' > params.json
          id=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "deploy $ENVIRONMENT ${FRONTEND_TAG:0:7}" --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command $id on $instance"
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = Success ] || { echo "::error::Release failed on the server ($status); it rolled back if it could."; exit 1; }

      # From the outside, as a user would reach it: through CloudFront.
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            curl -fsS "$APP_URL/health" >/dev/null && break || sleep 5
          done
          curl -fsS "$APP_URL/health"
          curl -fsS "$APP_URL/" | grep -q "<title>HealthConnect</title>"
          curl -fsS -o /dev/null -w "manifest: %{http_code}\n" "$APP_URL/manifest.webmanifest"
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://${APP_URL#https://}/")
          [ "$code" = 301 ] || { echo "::error::http:// should redirect to https:// (got $code)"; exit 1; }

      - name: Summary
        if: always()
        env:
          FRONTEND_TAG: ${{ steps.tags.outputs.frontend }}
          BACKEND_TAG: ${{ steps.tags.outputs.backend }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          {
            echo "### $ENVIRONMENT: ${{ job.status }}"
            echo "- URL: $APP_URL"
            echo "- frontend: \`$FRONTEND_TAG\`"
            echo "- backend: \`${BACKEND_TAG:-not deployed yet}\`"
            echo "- roll back: Actions → Deploy → Run workflow, with an older SHA from this list"
          } >> "$GITHUB_STEP_SUMMARY"
