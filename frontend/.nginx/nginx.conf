# Serves the PWA and forwards /api to the backend container, so the browser
# sees one origin (no CORS, no mixed content).

# Behind a load balancer or proxy the original scheme arrives in
# X-Forwarded-Proto; without it (laptop, single server) use our own.
map $http_x_forwarded_proto $client_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Client address (for the audit log and sign-in rate limits). Only a load
  # balancer inside the VPC (10.x) is trusted to say who the client is;
  # anyone else's X-Forwarded-For is ignored. Docker's own networks are 172.x.
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;

  # Docker's internal DNS. The backend name is resolved per request, so nginx
  # still starts when the backend container is not up yet.
  resolver 127.0.0.11 valid=10s;

  # Load balancer health check: nginx itself. The app works offline from the phone even when
  # the API is down, so the server stays "up" for the PWA; the API's health is separate.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The API's own health (the deploy waits for it once a backend is deployed).
  location = /api/health {
    set $backend http://backend:8080;
    proxy_pass $backend/health;
    access_log off;
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
  }

  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    # One clean client address for the API (never the client's own header).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_proto;
    # No backend container (yet, or restarting): a clear 503 the app's sync retries later,
    # instead of nginx's HTML error page.
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
  }

  location @api_unavailable {
    default_type application/json;
    add_header Retry-After 30 always;
    return 503 '{"error":"api_unavailable"}';
  }

  # Hashed build output never changes: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell and the service worker must always be revalidated, or users
  # get stuck on an old version.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: unknown paths load the shell and the router takes over.
  location / {
    try_files $uri /index.html;
  }
}
